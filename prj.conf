# Enable CHIP
CONFIG_CHIP=y
CONFIG_CHIP_PROJECT_CONFIG="src/chip_project_config.h"
CONFIG_CHIP_DEVICE_PRODUCT_NAME="Jamjari Occupancy Sensor"

# Configure ZAP file name
CONFIG_NCS_SAMPLE_MATTER_ZAP_FILE_PATH="${APPLICATION_CONFIG_DIR}/src/default_zap/occupancy_sensor.zap"

# 32768 == 0x8000 (example Product ID added temporaly,
# as there is no assigned PID on the following list:
# https://github.com/project-chip/connectedhomeip/blob/482e6fd03196a6de45465a90003947ef4b86e0b1/docs/examples/discussion/PID_allocation_for_example_apps.md)
CONFIG_CHIP_DEVICE_PRODUCT_ID=32768
CONFIG_STD_CPP17=y

# Enable Matter pairing automatically on application start.
CONFIG_CHIP_ENABLE_PAIRING_AUTOSTART=y

# Enable Matter extended announcement and increase duration to 1 hour.
CONFIG_CHIP_BLE_EXT_ADVERTISING=y
CONFIG_CHIP_BLE_ADVERTISING_DURATION=60

# Add support for LEDs and buttons on Nordic development kits
CONFIG_DK_LIBRARY=y

# Bluetooth Low Energy configuration
CONFIG_BT_DEVICE_NAME="Jamjari"
CONFIG_BT_DEVICE_NAME_MAX=18

# Suspend devices when the CPU goes into sleep
CONFIG_PM_DEVICE=y

# Other settings
CONFIG_THREAD_NAME=y
CONFIG_MPU_STACK_GUARD=y
CONFIG_RESET_ON_FATAL_ERROR=n
CONFIG_CHIP_LIB_SHELL=y
# E(보드 직접 전송) 1단계: 바깥 길 확인용 ot 셸 명령 (netdata·ping·dns)
CONFIG_OPENTHREAD_SHELL=y
# E 2단계①: OpenThread 를 소스로 빌드(미리 만든 FTD 라이브러리엔 TCP 가 없음). 기능 세트는 FTD 그대로
CONFIG_OPENTHREAD_SOURCES=y
CONFIG_OPENTHREAD_TCP_ENABLE=y
# TCP 를 켜면 OT 가 자기 TLS(ECJPAKE, 우리는 안 씀)까지 켜서 빌드가 깨짐 → 끔. 인터넷 TLS 는 앱에서 mbedTLS 로 따로
CONFIG_OPENTHREAD_CUSTOM_PARAMETERS="OPENTHREAD_CONFIG_TLS_ENABLE=0"
# E 2단계③: 보드가 HTTPS 로 직접 올리기 (Vercel 직통 · RSA 인증서 · SNI 필수)
CONFIG_JAMJARI_DIRECT_UPLOAD=y
# ECDHE-RSA 암호 묶음은 nrf_security 에서 아직 옛 RSA 설정(비공개 식별자)을 거쳐야 켜진다
CONFIG_MBEDTLS_DECLARE_PRIVATE_IDENTIFIERS=y
CONFIG_MBEDTLS_RSA_C=y
CONFIG_MBEDTLS_PKCS1_V15=y
CONFIG_MBEDTLS_PKCS1_V21=y
CONFIG_MBEDTLS_MPI_MAX_SIZE=512
CONFIG_MBEDTLS_KEY_EXCHANGE_ECDHE_RSA_ENABLED=y
CONFIG_MBEDTLS_SSL_SERVER_NAME_INDICATION=y
CONFIG_MBEDTLS_SSL_SRV_C=n
CONFIG_MBEDTLS_SSL_IN_CONTENT_LEN=16384
CONFIG_MBEDTLS_SSL_OUT_CONTENT_LEN=2048
CONFIG_MBEDTLS_HEAP_SIZE=49152

# Reduce application size
CONFIG_USE_SEGGER_RTT=n

# Enable Factory Data feature
CONFIG_CHIP_FACTORY_DATA=y
CONFIG_CHIP_FACTORY_DATA_BUILD=y

# 잠자리: HLK-LD2450 레이더 (uart1, 인터럽트 방식 수신)
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
